name: heavy-eq-tracker

services:
  mysql:
    image: 'mysql:9.7'
    environment:
      - 'MYSQL_DATABASE=${DB_NAME}'
      - 'MYSQL_USER=${DB_USER}'
      - 'MYSQL_PASSWORD=${DB_PASSWORD}'
      - 'MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}'
    ports:
      - '3306:3306'
  redis:
    image: 'redis:8'
    ports:
      - '6379:6379'

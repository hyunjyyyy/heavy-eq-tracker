spring:
  application:
    name: heavy-eq-tracker
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: tracker-judge
      auto-offset-reset: earliest
    listener:
      ack-mode: record

tracker:
  rate-limit:
    per-second: 10
  proximity:
    threshold-m: 10
    max-error-m: 10          # 이보다 큰 오차는 이 값으로 자른다
    stale-after: 10m         # 상대의 마지막 위치가 이보다 오래되면 후보에서 뺀다
    default-phone-error-m: 5
    default-rtk-error-m: 0.05

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.zaxxer.hikari.HikariConfig: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

